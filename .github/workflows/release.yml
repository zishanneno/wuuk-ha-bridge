name: Release Home Assistant add-on

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: wuuk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        run: python3 .github/scripts/release_metadata.py

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: ${{ env.ACT != 'true' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Buildx
        if: ${{ env.ACT != 'true' }}
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: ${{ env.ACT != 'true' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, test, and publish the multi-architecture image
        if: ${{ env.ACT != 'true' }}
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::This release image tag already exists"
            exit 1
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "BUILD_VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" --push ./wuuk_bridge
